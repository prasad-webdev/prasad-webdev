<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc">
<title id="title">Prasad Bairagi — Software Developer</title><desc id="desc">Animated dark developer profile banner.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b16"/><stop offset="1" stop-color="#101a32"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8da7d9" opacity=".18"/></pattern>
</defs>
<rect width="1000" height="330" rx="24" fill="url(#bg)"/><rect width="1000" height="330" rx="24" fill="url(#dots)"/>
<rect x="1" y="1" width="998" height="328" rx="23" fill="none" stroke="url(#line)" stroke-opacity=".7"/>
<circle cx="845" cy="140" r="100" fill="#247bff" opacity=".09"><animate attributeName="r" values="90;112;90" dur="6s" repeatCount="indefinite"/></circle>
<path d="M710 270 Q840 50 980 170" fill="none" stroke="#247bff" stroke-opacity=".5" stroke-width="2"><animate attributeName="stroke-opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/></path>
<text x="54" y="52" fill="#8ea8d8" font-family="monospace" font-size="15" letter-spacing="3">PRASAD BAIRAGI / DEVELOPER PROFILE</text>
<text x="52" y="126" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="49" font-weight="800">Building useful</text>
<text x="52" y="181" fill="#f5f7ff" font-family="Arial,sans-serif" font-size="49" font-weight="800">things with <tspan fill="#4c91ff">AI</tspan><tspan fill="#ff5368">.</tspan></text>
<text x="55" y="221" fill="#b9c6e4" font-family="Arial,sans-serif" font-size="19">MCA Student · Full-Stack Developer · Generative AI</text>
